spring:
  application:
    name: bank-account-service
  config:
    import: "optional:configserver:http://localhost:8888"
  # ========================================================================
  # Kafka (Parte III) — arquitectura orientada a eventos
  # El servicio publica eventos de dominio de cada movimiento y consume los
  # comandos de operación de monedero (Yanki) por Kafka, nunca por REST.
  # ========================================================================
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: bank-account-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# ==========================================================================
# Propiedades externalizadas (Parte I: "No deben tener configuraciones en el código")
# URLs base que consumen CustomerClientAdapter y CreditClientAdapter.
# La ausencia de valores por defecto en @Value es deliberada: la configuración
# vive SOLO aquí y en bank-config-repo, nunca dentro de la clase Java.
# ==========================================================================
app:
  urls:
    customer-service: "http://localhost:8081/customers/"
    credit-service: "http://localhost:8083/credits/"
  accounts:
    # Requerimiento Parte II: monto mínimo de apertura de las cuentas bancarias.
    # Puede ser cero (cuentas abribles sin monto inicial mínimo).
    minimum-opening-amount: 0.0
  kafka:
    # Parte III: arquitectura orientada a eventos con Kafka como message broker.
    topics:
      account-transactions: bank-account-transactions
      wallet-operations: wallet-operations
      wallet-operation-results: wallet-operation-results

# ==========================================================================
# Estándar de resiliencia (circuit breakers) — bank-resilience-commons
# Instancias: customerServiceCB (-> customer-service), creditServiceCB (-> credit-service)
# Regla obligatoria: minimumNumberOfCalls <= slidingWindowSize
# NOTA: si el config-server está disponible, sus valores tienen precedencia
# sobre este archivo (ver bank-config-repo/bank-account-service.yml).
# ==========================================================================
resilience4j:
  circuitbreaker:
    instances:
      customerServiceCB:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      creditServiceCB:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      customerServiceCB:
        timeoutDuration: 2s
        cancelRunningFuture: true
      creditServiceCB:
        timeoutDuration: 2s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
