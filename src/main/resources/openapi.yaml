openapi: 3.0.3
info:
  title: Bank Account Service API
  version: 1.0.0
  description: API para la gestión de cuentas bancarias (Pasivos)
paths:
  /bank-accounts:
    get:
      summary: Obtener todas las cuentas
      operationId: findAll
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankAccountResponse'
    post:
      summary: Crear una cuenta bancaria
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountResponse'
  /bank-accounts/{id}:
    get:
      summary: Obtener cuenta por ID
      operationId: findById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountResponse'
    put:
      summary: Actualizar una cuenta
      operationId: update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountResponse'
    delete:
      summary: Eliminar una cuenta
      operationId: delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
  /bank-accounts/{accountId}/transactions:
    post:
      summary: Registrar un depósito o retiro en la cuenta
      operationId: createTransaction
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '201':
          description: Transacción exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
    get:
      summary: Obtener el historial de movimientos de la cuenta
      operationId: getTransactionsByAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
  /bank-accounts/transfers:
    post:
      summary: Realizar una transferencia entre cuentas
      operationId: createTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: Transferencia exitosa
  # CRUD completo de la entidad Transaction (FindAll / FindById / Update / Delete)
  /bank-accounts/transactions:
    get:
      summary: Obtener todos los movimientos registrados en el sistema
      operationId: findAllTransactions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
  /bank-accounts/transactions/{transactionId}:
    get:
      summary: Obtener un movimiento por su ID
      operationId: findTransactionById
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
    put:
      summary: Corregir un movimiento registrado
      operationId: updateTransaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
    delete:
      summary: Eliminar un movimiento registrado
      operationId: deleteTransaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
  # Consulta de saldos disponibles (Parte I: "consultar los saldos disponibles en sus
  # productos como: cuentas bancarias y tarjetas de crédito")
  /bank-accounts/{id}/balance:
    get:
      summary: Obtener el saldo disponible de una cuenta bancaria
      operationId: getAvailableBalance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableBalanceResponse'
  # ==========================================================================
  # Tarjetas de débito (Parte III): "Los clientes ahora pueden tener tarjetas de
  # débito asociado a sus cuentas bancarias y hacer pagos con ellas."
  # CRUD completo de la entidad DebitCard + pagos + consulta de movimientos.
  # ==========================================================================
  /debit-cards:
    get:
      summary: Obtener todas las tarjetas de débito
      operationId: findAllDebitCards
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DebitCardResponse'
    post:
      summary: Crear una tarjeta de débito asociada a una cuenta bancaria
      operationId: createDebitCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitCardRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitCardResponse'
  /debit-cards/{id}:
    get:
      summary: Obtener una tarjeta de débito por su ID
      operationId: findDebitCardById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitCardResponse'
    put:
      summary: Actualizar una tarjeta de débito (por ejemplo, bloquear o activar)
      operationId: updateDebitCard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitCardRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitCardResponse'
    delete:
      summary: Eliminar una tarjeta de débito
      operationId: deleteDebitCard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
  /debit-cards/customer/{customerId}:
    get:
      summary: Obtener las tarjetas de débito de un cliente
      operationId: findDebitCardsByCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DebitCardResponse'
  /debit-cards/{id}/payments:
    post:
      summary: Realizar un pago con la tarjeta de débito (debita la cuenta asociada)
      operationId: payWithDebitCard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitCardPaymentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitCardPaymentResponse'
  /debit-cards/{id}/movements:
    get:
      summary: Obtener los movimientos (pagos) de una tarjeta de débito
      operationId: getDebitCardMovements
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
  # ==========================================================================
  # Reportes (Parte II):
  #  - Reporte general por producto del banco en un intervalo de tiempo.
  #  - Reporte de los últimos 10 movimientos de la tarjeta de débito.
  # ==========================================================================
  /reports/bank-accounts/products-summary:
    get:
      summary: Reporte general por producto (tipo de cuenta) en un intervalo de tiempo
      operationId: getAccountProductsSummary
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          description: "Fecha inicial del intervalo (inclusive), formato YYYY-MM-DD."
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          description: "Fecha final del intervalo (inclusive), formato YYYY-MM-DD."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductReportItem'
  /reports/debit-card/{cardId}/last-movements:
    get:
      summary: Últimos 10 movimientos de una tarjeta de débito
      operationId: getDebitCardLastMovements
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
components:
  schemas:
    BankAccountRequest:
      type: object
      required:
        - customerId
        - accountType
      properties:
        customerId:
          type: string
        accountType:
          type: string
          description: "SAVINGS, CURRENT, FIXED_TERM, VIP, PYME"
        balance:
          type: number
          format: double
        maintenanceFee:
          type: number
          format: double
          description: >-
            Comisión de mantenimiento. Regla de negocio: obligatoria y mayor que cero en
            cuentas corrientes; se fuerza a 0 en ahorro y a plazo fijo.
        maxMovements:
          type: integer
          description: >-
            Movimientos mensuales libres de comisión. Obligatorio en cuentas de ahorro;
            se fuerza a null (sin límite) en cuentas corrientes.
        fixedTermWithdrawalDay:
          type: integer
          minimum: 1
          maximum: 31
          description: >-
            Día de cada mes en el que una cuenta a plazo fijo admite su único movimiento
            de retiro o depósito (por defecto 1).
        holders:
          type: array
          description: "Titulares de la cuenta. Obligatorio al menos uno en cuentas empresariales."
          items:
            type: string
        signatories:
          type: array
          description: "Firmantes autorizados. Puede ser una lista vacía (cero firmantes)."
          items:
            type: string
    AvailableBalanceResponse:
      type: object
      description: "Saldo disponible actual de una cuenta bancaria (Parte I)."
      properties:
        accountId:
          type: string
          description: "Identificador de la cuenta bancaria."
        customerId:
          type: string
          description: "Identificador del cliente titular de la cuenta."
        accountType:
          type: string
          description: "SAVINGS, CURRENT, FIXED_TERM, VIP, PYME"
        balance:
          type: number
          format: double
          description: "Saldo disponible actual de la cuenta."
    DebitCardRequest:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: string
          description: "Identificador de la cuenta bancaria a la que se asocia la tarjeta."
        status:
          type: string
          description: "Estado de la tarjeta: ACTIVE o BLOCKED. Por defecto ACTIVE."
    DebitCardResponse:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
          description: "Cuenta bancaria asociada a la tarjeta de débito."
        customerId:
          type: string
          description: "Cliente titular de la cuenta asociada."
        cardNumber:
          type: string
          description: "Número de tarjeta de débito generado."
        status:
          type: string
          description: "ACTIVE o BLOCKED."
        createdAt:
          type: string
          format: date-time
    DebitCardPaymentRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          description: "Importe del pago con la tarjeta. Debe ser mayor que cero."
        description:
          type: string
          description: "Descripción o comercio del pago (opcional)."
    DebitCardPaymentResponse:
      type: object
      properties:
        cardId:
          type: string
        accountId:
          type: string
        transactionId:
          type: string
        amount:
          type: number
          format: double
        fee:
          type: number
          format: double
          description: "Comisión aplicada al pago según las reglas de la cuenta."
        balanceAfter:
          type: number
          format: double
          description: "Saldo disponible de la cuenta tras el pago."
        paymentDate:
          type: string
          format: date-time
    ProductReportItem:
      type: object
      description: Fila del reporte general por producto del banco en un intervalo de tiempo.
      properties:
        productType:
          type: string
          description: "Tipo de producto (por ejemplo SAVINGS, CURRENT, CREDIT_CARD)."
        numberOfProducts:
          type: integer
          format: int64
          description: "Cantidad de productos de ese tipo."
        totalBalance:
          type: number
          format: double
          description: "Saldo total acumulado de los productos de ese tipo."
        numberOfMovements:
          type: integer
          format: int64
          description: "Cantidad de movimientos del producto registrados en el intervalo."
        totalMovementAmount:
          type: number
          format: double
          description: "Importe total de los movimientos registrados en el intervalo."
    BankAccountResponse:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        accountType:
          type: string
        balance:
          type: number
          format: double
        maintenanceFee:
          type: number
          format: double
          description: "Comisión de mantenimiento aplicada al producto."
        maxMovements:
          type: integer
          description: "Movimientos mensuales libres de comisión; null = sin límite."
        fixedTermWithdrawalDay:
          type: integer
          description: "Día del mes habilitado para mover una cuenta a plazo fijo."
        holders:
          type: array
          items:
            type: string
        signatories:
          type: array
          items:
            type: string
    TransactionRequest:
      type: object
      required:
        - transactionType
        - amount
      properties:
        transactionType:
          type: string
          description: "DEPOSIT, WITHDRAWAL, TRANSFER_IN, TRANSFER_OUT, DEBIT_CARD_PAYMENT"
        amount:
          type: number
          format: double
        debitCardId:
          type: string
          description: >-
            Identificador de la tarjeta de débito cuando el movimiento corresponde a un
            pago realizado con ella (tipo DEBIT_CARD_PAYMENT). Opcional.
    TransactionResponse:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        transactionType:
          type: string
        amount:
          type: number
          format: double
        fee:
          type: number
          format: double
          description: "Comisión cobrada si se superó el límite de movimientos gratuitos"
        debitCardId:
          type: string
          description: "Tarjeta de débito asociada cuando el movimiento es un pago con tarjeta."
        transactionDate:
          type: string
          format: date-time
    TransferRequest:
      type: object
      required:
        - sourceAccountId
        - targetAccountId
        - amount
      properties:
        sourceAccountId:
          type: string
          description: "ID de la cuenta origen (la que envía el dinero)"
        targetAccountId:
          type: string
          description: "ID de la cuenta destino (la que recibe el dinero)"
        amount:
          type: number
          format: double
    CustomerDTO:
      type: object
      properties:
        id:
          type: string
        documentNumber:
          type: string
        name:
          type: string
        customerType:
          type: string
        profile:
          type: string